name: CI

# Lint, full verification, and build on every push and pull request.
#
# `corepack pnpm verify` includes scripts/verify/data-snapshot.ts, which pins the
# frozen 2026 archive. Live data commits (data/live/**) are pushed by the
# live-forecast workflow with GITHUB_TOKEN, which does not trigger this workflow;
# they are validated by that job instead.

on:
  push:
    branches: [main, feature/setup]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Verify (invariants + refresh checks + data snapshot)
        run: corepack pnpm verify

      - name: Ledger is append-only against main
        run: |
          git fetch --no-tags origin main
          corepack pnpm verify:ledger origin/main

      - name: Build
        run: corepack pnpm build
