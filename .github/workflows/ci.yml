name: CI

# Lint, full verification, and build on every push and pull request.
#
# `corepack pnpm verify` includes scripts/verify/data-snapshot.ts, which pins the
# frozen 2026 archive. Live data commits (data/live/**) go to the live-data branch,
# pushed by the live-forecast workflow with GITHUB_TOKEN, which does not trigger this
# workflow; that job checks each push against live-data's previous head. Main's
# data/live stopped at the cutover, and the ledger step below keeps that copy from
# changing. A pull request cannot change live-data, so it is not checked here.

on:
  push:
    branches: [main, feature/setup]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Verify (invariants + refresh checks + data snapshot)
        run: corepack pnpm verify

      - name: Main's frozen ledger copy is unchanged against main
        run: |
          git fetch --no-tags origin main
          corepack pnpm verify:ledger origin/main

      - name: Build
        run: corepack pnpm build
