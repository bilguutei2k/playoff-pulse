name: Live forecast

# Runs about every ten minutes by starting its own next run: each chained run waits
# for the next ten-minute mark, refreshes results, seals forecasts, re-simulates the
# season, commits data/live/** to the live-data branch when something changed, and then
# starts the next run.
# GitHub's own schedule proved far too unreliable (2 of about 27 slots in the first 13
# hours, 4 runs in 18 hours on 2026-11-03), so it stays only as a fallback that restarts
# the chain if a dispatch is ever lost.
#
# A failure publishes nothing, leaves the last good state up, and fails the job, which
# makes GitHub email the owner. The chain never stops on its own: after three failures in
# a row it backs off, and each next run waits about 30 minutes instead of 10; one success
# brings it back to 10 (scripts/live/chain-decision.sh). While it keeps failing it opens
# one issue per UTC day, "Live job failing on <date>", with the failing run's URL
# (scripts/live/failure-alert.sh, never fails the job). To stop the chain, disable the
# workflow. Pushes made with GITHUB_TOKEN do not trigger ci.yml, so these commits are
# checked here: verify:ledger against live-data's previous head, and verify:live.
#
# The git steps are scripts/live/data-checkout.sh and scripts/live/data-commit.sh, which
# tests/live-data-git.test.ts runs against a throwaway origin on every CI run.
#
# Code and data live apart. Every run executes main's code and reads and writes
# data/live from the live-data branch, whose commits change only data/live. Vercel never
# deploys live-data (git.deploymentEnabled in vercel.json, which live-data's tree carries
# because the branch is cut from main), so data commits use none of Hobby's 100 daily
# deployments; the site reads live-data at request time (src/lib/live-data/published.ts).
# If live-data does not exist, the run creates it from main's HEAD at that moment. The
# concurrency group serializes real runs, so the last run that pushed data to main has
# landed before the first run bootstraps live-data.
#
# Every run also checks that production runs main's latest deployable code and retries
# a deploy Vercel refused (scripts/live/deploy-check.sh); that step never fails the job.
#
# dry_run=true runs everything except the pushes and the next-run step, prints what it
# would commit and where and how long a next run would wait, and opens no issues. A dry
# run dispatched from another branch runs that branch's code, so a change can be tried
# before it merges; it has its own concurrency group and the chain step ignores it.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Started by the previous run: wait for the next ten-minute mark (plus the backoff)"
        type: boolean
        default: false
      wait_minutes:
        description: "With chain: minutes between runs, 10, or 30 after three failures in a row (other values are clamped to 10..30)"
        type: string
        default: "10"
      dry_run:
        description: "Push nothing and start no next run; print what would be committed and where"
        type: boolean
        default: false

run-name: ${{ inputs.dry_run && 'Live forecast (dry run)' || 'Live forecast' }}

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  # Real runs share one group, so they never overlap. A dry run pushes nothing and gets
  # its own, so it never displaces a queued real run.
  group: ${{ inputs.dry_run && 'live-forecast-dry-run' || 'live-forecast' }}
  cancel-in-progress: false

env:
  DATA_BRANCH: live-data
  DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

jobs:
  forecast:
    runs-on: ubuntu-latest
    # The wait is at most 30 minutes and has its own limit, so the work after it keeps at
    # least the 25 minutes the whole job had before the backoff.
    timeout-minutes: 60

    steps:
      # The next ten-minute mark, plus 20 minutes when backing off (wait_minutes=30), so
      # runs start on ten-minute marks about 10 or 30 minutes apart.
      - name: Wait for the next ten-minute mark
        if: inputs.chain == true
        timeout-minutes: 32
        env:
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          minutes="${WAIT_MINUTES:-10}"
          case "$minutes" in ''|*[!0-9]*) minutes=10 ;; esac
          if [ "$minutes" -lt 10 ]; then minutes=10; fi
          if [ "$minutes" -gt 30 ]; then minutes=30; fi
          now=$(date +%s)
          next=$(( (now / 600 + 1) * 600 + (minutes - 10) * 60 ))
          echo "Waiting $((next - now))s, until $(date -u -d "@$next" +%H:%M:%S) UTC (about $minutes minutes between runs)."
          sleep $((next - now))

      # Main's code. A dry run dispatched from another branch runs that branch's code.
      - name: Check out main's code
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.dry_run && github.ref_name != 'main') && github.ref_name || 'main' }}
          fetch-depth: 20

      # Sets DATA_BASE (live-data's head, or main's when bootstrapping) and DATA_BOOTSTRAP.
      - name: Check out data/live from live-data
        run: bash scripts/live/data-checkout.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run forecast pipeline
        timeout-minutes: 20
        run: corepack pnpm live:pipeline

      - name: Check ledger and live state
        run: |
          corepack pnpm verify:ledger "$DATA_BASE"
          corepack pnpm verify:live

      # A commit on live-data whose tree is its previous head's with data/live replaced, so
      # live-data's other files, vercel.json included, stay as they were cut from main.
      - name: Commit and push data to live-data
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/live/data-commit.sh

      # A report problem never fails the job, because failures slow the chain and cost the
      # seals still due. It opens one issue per slate, which emails the owner.
      - name: Open an issue if injury reports are not reaching the forecasts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/live/report-alert.sh "Injury report problem"

      # Never fails the job: a refused code deploy must not cost seals or slow the chain.
      - name: Retry a production deploy Vercel refused
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/live/deploy-check.sh

      # How the chain continues: failures in a row, this run included, give the next run's
      # wait and whether to open the daily issue (scripts/live/chain-decision.sh). Dry runs
      # are left out of the run list, so they never change what a real run does; a dry run
      # runs this step only to print what a real run would decide. Never fails the job: if
      # it cannot run, the next run is still started, with the longer wait.
      - name: Decide the next run
        id: next
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_STATUS: ${{ job.status }}
        run: |
          if ! recent=$(gh run list --workflow=live-forecast.yml --limit 20 --status completed --json conclusion,displayTitle \
            --jq '.[] | select(.displayTitle | endswith("(dry run)") | not) | .conclusion'); then
            echo "Could not read earlier runs; deciding from this run alone."
            recent=""
          fi
          # Word splitting is intended: one argument per earlier conclusion, newest first.
          # shellcheck disable=SC2086
          bash scripts/live/chain-decision.sh "$THIS_STATUS" $recent | tee -a "$GITHUB_OUTPUT"

      # One issue per UTC day while the job keeps failing. Never fails the job.
      - name: Open an issue if the live job keeps failing
        if: always() && inputs.dry_run != true && steps.next.outputs.open_issue == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STREAK: ${{ steps.next.outputs.streak }}
        run: bash scripts/live/failure-alert.sh "Live job failing" "$RUN_URL" "$STREAK"

      # Also exercises the watchdog on a real runner before its new workflow exists on
      # main (GitHub may refuse workflow_dispatch for an unregistered workflow).
      - name: Dry run watchdog decisions
        if: always() && inputs.dry_run == true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live/watchdog.mjs

      - name: Dry run, no next run
        if: always() && inputs.dry_run == true
        env:
          WAIT_MINUTES: ${{ steps.next.outputs.wait_minutes }}
        run: |
          echo "Dry run: the next run is not started (a real run would start it waiting about ${WAIT_MINUTES:-?} minutes)."

      # Always dispatch: a run-list observation can be stale and strand the chain.
      # GitHub allows one running and one pending run per group; a newer pending run
      # replaces the older one, without cancelling the running job:
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
      - name: Start the next run
        if: always() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_MINUTES: ${{ steps.next.outputs.wait_minutes || '30' }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run live-forecast.yml --ref main -f chain=true -f wait_minutes="$WAIT_MINUTES"; then
              echo "Next run requested; it starts about $WAIT_MINUTES minutes after this one."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed."
            sleep 10
          done
          exit 1
