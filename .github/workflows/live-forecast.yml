name: Live forecast

# An outside scheduler calls workflow_dispatch every 10 minutes, because GitHub's own
# schedule proved far too unreliable: 2 of about 27 slots ran in the first 13 hours.
# The schedule below stays as a backup, at off-peak minutes. Each run refreshes
# results, seals today's forecasts, re-simulates the season, and commits data/live/**
# only when something changed. Commits touching more than data/live/games deploy to
# production through Vercel (see vercel.json).
#
# A failure publishes nothing, leaves the last good state up, and fails the job,
# which makes GitHub email the owner. Pushes made with GITHUB_TOKEN do not trigger
# ci.yml, so these commits are checked here instead.

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run forecast pipeline
        run: corepack pnpm live:pipeline

      - name: Check ledger and live state
        run: |
          corepack pnpm verify:ledger
          corepack pnpm verify:live

      - name: Commit and push changes
        run: |
          git add data/live
          if git diff --cached --quiet; then
            echo "No real change to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(live): update forecasts"
          for attempt in 1 2; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed."
            sleep 15
          done
          exit 1
