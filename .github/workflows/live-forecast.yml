name: Live forecast

# Runs about every ten minutes by starting its own next run: each chained run waits
# for the next ten-minute mark, refreshes results, seals forecasts, re-simulates the
# season, commits data/live/** to the live-data branch when something changed, and then
# starts the next run.
# GitHub's own schedule proved far too unreliable (2 of about 27 slots in the first 13
# hours), so it stays only as a fallback that restarts the chain if it ever breaks.
#
# A failure publishes nothing, leaves the last good state up, and fails the job, which
# makes GitHub email the owner. After three failures in a row the chain stops and the
# fallback schedule takes over, so a persistent bug does not email every ten minutes.
# Pushes made with GITHUB_TOKEN do not trigger ci.yml, so these commits are checked
# here: verify:ledger against live-data's previous head, and verify:live.
#
# Code and data live apart. Every run executes main's code and reads and writes
# data/live from the live-data branch, whose commits change only data/live. Vercel never
# deploys live-data (git.deploymentEnabled in vercel.json, which live-data's tree carries
# because the branch is cut from main), so data commits use none of Hobby's 100 daily
# deployments; the site reads live-data at request time (src/lib/live-data/published.ts).
# If live-data does not exist, the run creates it from main's HEAD at that moment. The
# concurrency group serializes real runs, so the last run that pushed data to main has
# landed before the first run bootstraps live-data.
#
# Every run also checks that production runs main's latest deployable code and retries
# a deploy Vercel refused (scripts/live/deploy-check.sh); that step never fails the job.
#
# dry_run=true runs everything except the pushes and the next-run step, prints what it
# would commit and where, and opens no issues. A dry run dispatched from another branch
# runs that branch's code, so a change can be tried before it merges; it has its own
# concurrency group and the chain step ignores it.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Started by the previous run: wait for the next ten-minute mark"
        type: boolean
        default: false
      dry_run:
        description: "Push nothing and start no next run; print what would be committed and where"
        type: boolean
        default: false

run-name: ${{ inputs.dry_run && 'Live forecast (dry run)' || 'Live forecast' }}

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  # Real runs share one group, so they never overlap. A dry run pushes nothing and gets
  # its own, so it never displaces a queued real run.
  group: ${{ inputs.dry_run && 'live-forecast-dry-run' || 'live-forecast' }}
  cancel-in-progress: false

env:
  DATA_BRANCH: live-data
  DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Wait for the next ten-minute mark
        if: inputs.chain == true
        run: |
          now=$(date +%s)
          next=$(( (now / 600 + 1) * 600 ))
          echo "Waiting $((next - now))s, until $(date -u -d "@$next" +%H:%M:%S) UTC."
          sleep $((next - now))

      # Main's code. A dry run dispatched from another branch runs that branch's code.
      - name: Check out main's code
        uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.dry_run && github.ref_name != 'main') && github.ref_name || 'main' }}
          fetch-depth: 20

      - name: Check out data/live from live-data
        run: |
          git fetch --no-tags --depth=20 origin main
          echo "Code: $(git rev-parse --abbrev-ref HEAD) at $(git rev-parse HEAD)."
          if git fetch --no-tags --depth=20 origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"; then
            base=$(git rev-parse "origin/$DATA_BRANCH")
            bootstrap=0
            echo "Data: $DATA_BRANCH at $base."
          else
            base=$(git rev-parse origin/main)
            bootstrap=1
            echo "Data: $DATA_BRANCH does not exist yet; this run bootstraps it from main's HEAD $base."
          fi
          rm -rf data/live
          git checkout "$base" -- data/live
          git reset -q
          echo "DATA_BASE=$base" >> "$GITHUB_ENV"
          echo "DATA_BOOTSTRAP=$bootstrap" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run forecast pipeline
        run: corepack pnpm live:pipeline

      - name: Check ledger and live state
        run: |
          corepack pnpm verify:ledger "$DATA_BASE"
          corepack pnpm verify:live

      # A commit on live-data whose tree is its previous head's with data/live replaced, so
      # live-data's other files, vercel.json included, stay as they were cut from main.
      - name: Commit and push data to live-data
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/live-data.index"
          git read-tree "$DATA_BASE"
          # Stage data/live exactly as the pipeline left it, deletions included. The temporary
          # index holds live-data's tree, which differs from main's, so `git rm --cached` would
          # refuse those paths once the branches diverge.
          git add -A -- data/live
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse "$DATA_BASE^{tree}")" ]; then
            if [ "$DATA_BOOTSTRAP" = "0" ]; then
              echo "No real change to publish."
              exit 0
            fi
            commit="$DATA_BASE"
          else
            commit=$(git commit-tree "$tree" -p "$DATA_BASE" -m "chore(live): update forecasts")
          fi
          if ! git show "$tree:vercel.json" | jq -e '.git.deploymentEnabled["live-data"] == false' > /dev/null; then
            echo "::error::vercel.json in live-data's tree does not turn off deployments for live-data; refusing to push."
            if [ "$DRY_RUN" != "1" ]; then
              exit 1
            fi
          fi
          if [ "$DATA_BOOTSTRAP" = "1" ]; then
            what="create $DATA_BRANCH at $commit, cut from main's HEAD $DATA_BASE"
          else
            what="fast-forward $DATA_BRANCH from $DATA_BASE to $commit"
          fi
          git diff --stat "$DATA_BASE" "$commit" | tail -n 25
          if [ "$DRY_RUN" = "1" ]; then
            echo "Dry run: would $what (git push origin $commit:refs/heads/$DATA_BRANCH)."
            exit 0
          fi
          for attempt in 1 2; do
            if git push origin "$commit:refs/heads/$DATA_BRANCH"; then
              echo "Pushed: $what."
              exit 0
            fi
            echo "Push attempt $attempt failed."
            sleep 15
          done
          exit 1

      # A report problem never fails the job, because three failures would stop the chain and
      # cost the seals still due. It opens one issue per slate, which emails the owner.
      - name: Open an issue if injury reports are not reaching the forecasts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/live/report-alert.sh "Injury report problem"

      # Never fails the job: a refused code deploy must not cost seals or stop the chain.
      - name: Retry a production deploy Vercel refused
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/live/deploy-check.sh

      - name: Dry run, no next run
        if: always() && inputs.dry_run == true
        run: |
          echo "Dry run: the next run is not started."

      # Dry runs are left out of both run lists, so they never change what a real run does.
      - name: Start the next run
        if: always() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
          THIS_STATUS: ${{ job.status }}
        run: |
          others=$(gh run list --workflow=live-forecast.yml --limit 20 --json databaseId,status,displayTitle \
            --jq "[.[] | select(.status != \"completed\" and (.databaseId | tostring) != \"$THIS_RUN\" and (.displayTitle | endswith(\"(dry run)\") | not))] | length")
          if [ "$others" != "0" ]; then
            echo "Another run is already queued or running; it will start the next one."
            exit 0
          fi
          recent=$(gh run list --workflow=live-forecast.yml --limit 20 --status completed --json conclusion,displayTitle \
            --jq '[.[] | select(.displayTitle | endswith("(dry run)") | not) | .conclusion][:2] | join(",")')
          if [ "$THIS_STATUS" != "success" ] && [ "$recent" = "failure,failure" ]; then
            echo "Three failures in a row; stopping the chain. The schedule will restart it."
            exit 0
          fi
          gh workflow run live-forecast.yml --ref main -f chain=true
          echo "Next run requested."
